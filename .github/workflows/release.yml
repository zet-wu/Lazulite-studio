name: Prepare release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, new or existing (for example v0.1.0-preview)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Select source for release draft
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          else
            commit="$SOURCE_COMMIT"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    uses: ./.github/workflows/portable.yml
    with:
      target: all
      model_release_tag: ${{ inputs.tag }}
      source_ref: ${{ needs.source.outputs.commit }}
  models:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Build shared model ZIPs
        run: python packaging/build_models.py --output "$RUNNER_TEMP/model-assets" --cache "$RUNNER_TEMP/model-cache"
      - run: npm ci --prefix .github/actions/upload-packages --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/upload-packages
        with:
          path: ${{ runner.temp }}/model-assets
  draft:
    needs: [source, build, models]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: "{LazuliteStudio-*.7z*,NextFire-karaoke-ja-Latn.zip,MMS_FA.zip}"
          merge-multiple: true
          path: release-assets
      - name: Create or update draft and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python packaging/release.py --assets release-assets
