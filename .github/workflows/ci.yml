name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir frontend exec tsc -b --noEmit
      - name: Run frontend unit tests
        run: pnpm --dir frontend test
      - name: Check i18n resources
        run: pnpm --dir frontend i18n:check
      - name: Build frontend
        run: pnpm --dir frontend build
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: 'pip'
          cache-dependency-path: 'server/requirements*.txt'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - name: Run server and packaging tests
        run: pytest server/tests packaging/tests
